name: Machine Learning Retraining CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  train-and-evaluate:
    name: Run MLflow Training Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLflow Project Retraining
        run: |
          mlflow run MLProject --env-manager=local

      - name: Upload MLflow Model & Training Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifacts-run-${{ github.run_number }}
          path: |
            mlruns/
          retention-days: 14
